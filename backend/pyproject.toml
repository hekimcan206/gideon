[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gideon"
version = "1.0.0"
description = "Voice desktop assistant backend: wake word, VAD, STT, skills and streaming TTS over a versioned WebSocket protocol."
license = "MIT"
requires-python = ">=3.12,<3.14"
authors = [{ name = "hekimcan206" }]
# The core package is engine-free: the pipeline, protocol, skills and server run (and are tested) with fakes.
dependencies = [
  "numpy==2.5.4",
  "pydantic==2.14.3",
  "websockets==17.4",
]

[project.optional-dependencies]
# Real speech engines. openwakeword itself is installed separately with --no-deps (see scripts/install.*):
# its metadata pins tflite-runtime on Linux, which has no CPython 3.12 wheels, while GIDEON only uses the ONNX
# backend. The dependencies it really imports are listed here instead.
engines = [
  "faster-whisper==1.2.1",
  "edge-tts==7.3.1",
  "webrtcvad-wheels==2.0.14.post1",
  "onnxruntime==1.31.1",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "tqdm==4.70.1",
  "requests==2.34.2",
  "miniaudio==1.72",
]
# Live microphone capture and speaker playback (not needed in simulated-audio mode).
live = ["sounddevice==0.5.6"]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "pytest-cov==7.1.0",
  "ruff==0.17.4",
  "mypy==2.4.1",
]

[project.scripts]
gideon = "gideon.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gideon = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "engines: needs the real speech engines and the generated WAV fixtures (integration)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "PT", "C4"]
ignore = ["S101", "S603", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT018"]
# Offline batch tools (benchmark, fixture generation): blocking file I/O between awaits is intended.
"src/gideon/{bench,fixtures}.py" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gideon"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "openwakeword.*", "edge_tts.*", "webrtcvad.*", "miniaudio.*", "sounddevice.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["gideon"]
omit = ["*/gideon/engines/*", "*/gideon/__main__.py"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 110; prose in docstrings and comments may run a little longer.
max-line-length = 120
